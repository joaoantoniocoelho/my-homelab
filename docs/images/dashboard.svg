<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Homelab native macOS dashboard</title>
  <desc id="desc">Illustration of the server dashboard with fictional CPU, RAM, disk, GPU, and service metrics. No real server details.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#18342f"/><stop offset=".6" stop-color="#111923"/><stop offset="1" stop-color="#26213c"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#66e3b5" stop-opacity=".18"/><stop offset="1" stop-color="#66e3b5" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-opacity=".35"/>
    </filter>
    <g id="rack" fill="none" stroke="currentColor" stroke-width="2.4">
      <rect width="28" height="12" rx="3"/><rect y="17" width="28" height="12" rx="3"/>
      <circle cx="6" cy="6" r="1" fill="currentColor"/><circle cx="6" cy="23" r="1" fill="currentColor"/>
      <path d="M19 6h4M19 23h4"/>
    </g>
    <g id="chip" fill="none" stroke="currentColor" stroke-width="1.8">
      <rect x="4" y="4" width="18" height="18" rx="3"/><rect x="9" y="9" width="8" height="8" rx="1"/>
      <path d="M9 0v4m8-4v4M9 22v4m8-4v4M0 9h4m-4 8h4m18-8h4m-4 8h4"/>
    </g>
  </defs>
  <rect width="1280" height="800" rx="24" fill="url(#backdrop)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="58" y="50" fill="#a0b9b1" font-size="11" letter-spacing="3">YOUR SERVER. AT A GLANCE.</text>
    <g filter="url(#shadow)">
      <rect x="40" y="78" width="1200" height="650" rx="16" fill="#0c0f13" stroke="#ffffff" stroke-opacity=".12"/>
      <path d="M56 78h180v650H56a16 16 0 0 1-16-16V94a16 16 0 0 1 16-16" fill="#10151a"/>
      <path d="M236 78v650M236 190h1004" stroke="#ffffff" stroke-opacity=".07"/>
      <circle cx="64" cy="99" r="5" fill="#ff6159"/><circle cx="82" cy="99" r="5" fill="#ffbe2f"/><circle cx="100" cy="99" r="5" fill="#28ca42"/>
      <rect x="62" y="130" width="40" height="42" rx="10" fill="#66e3b5" fill-opacity=".08"/>
      <use href="#rack" x="68" y="137" color="#66e3b5"/>
      <text x="112" y="152" fill="#eef3f6" font-size="23" font-weight="650">homelab</text>
      <text x="64" y="220" fill="#74818e" font-size="10" letter-spacing="2">WORKSPACE</text>
      <rect x="52" y="240" width="172" height="40" rx="9" fill="#66e3b5" fill-opacity=".09"/>
      <g font-size="13">
        <text x="77" y="265" fill="#66e3b5" font-weight="600">▦</text><text x="108" y="265" fill="#66e3b5" font-weight="600">Servidor</text>
        <use href="#chip" x="73" y="297" color="#94a4b2" transform="translate(17 65) scale(.8)"/>
        <text x="108" y="315" fill="#a1afbb">GPU</text>
        <text x="77" y="365" fill="#a1afbb">✧</text><text x="108" y="365" fill="#a1afbb">Ollama</text>
        <text x="77" y="415" fill="#a1afbb">▤</text><text x="108" y="415" fill="#a1afbb">Serviços</text>
        <text x="74" y="465" fill="#a1afbb" font-family="monospace">&gt;_</text><text x="108" y="465" fill="#a1afbb">Terminal</text>
      </g>
      <rect x="54" y="619" width="167" height="87" rx="11" fill="#0c0f13"/>
      <circle cx="70" cy="642" r="3" fill="#66e3b5"/>
      <text x="83" y="646" fill="#eef3f6" font-size="12" font-weight="600">homelab</text>
      <text x="67" y="666" fill="#7c8e9c" font-size="10" font-family="monospace">server.example.com</text>
      <text x="67" y="691" fill="#a1afbb" font-size="11">Configurações</text>
      <text x="264" y="136" fill="#f2f5f6" font-size="27" font-weight="650">Servidor</text>
      <text x="265" y="161" fill="#97a7b4" font-size="12">Seu servidor, em tempo real.</text>
      <rect x="1009" y="125" width="82" height="27" rx="14" fill="#66e3b5" fill-opacity=".1"/>
      <circle cx="1023" cy="138" r="3" fill="#66e3b5"/><text x="1033" y="143" fill="#66e3b5" font-size="12" font-weight="600">Online</text>
      <rect x="1110" y="125" width="103" height="28" rx="7" fill="#222b33"/>
      <text x="1130" y="144" fill="#d5dfe5" font-size="12">&gt;_ Terminal</text>
      <text x="265" y="220" fill="#778b9a" font-size="10" letter-spacing="2">RECURSOS DO SERVIDOR</text>
      <text x="1138" y="220" fill="#778b9a" font-size="10">A cada 3s</text>
      <g fill="#121920" stroke="#ffffff" stroke-opacity=".065">
        <rect x="264" y="238" width="225" height="131" rx="12"/><rect x="504" y="238" width="225" height="131" rx="12"/>
        <rect x="744" y="238" width="225" height="131" rx="12"/><rect x="984" y="238" width="229" height="131" rx="12"/>
        <rect x="264" y="388" width="657" height="225" rx="12"/><rect x="939" y="388" width="274" height="225" rx="12"/>
        <rect x="264" y="631" width="657" height="74" rx="12"/><rect x="939" y="631" width="274" height="74" rx="12"/>
      </g>
      <g fill="#a0afbb" font-size="12"><text x="282" y="263">CPU</text><text x="522" y="263">Memória RAM</text><text x="762" y="263">Disco · /</text><text x="1002" y="263">Uptime</text></g>
      <g fill="#f2f5f6" font-size="29" font-weight="550"><text x="282" y="305">24%</text><text x="522" y="305">8,0 GiB</text><text x="762" y="305">72,0 GiB</text><text x="1002" y="305">12d 8h</text></g>
      <g stroke-width="3" stroke-linecap="round">
        <path d="M283 324h187" stroke="#66e3b5" stroke-opacity=".1"/><path d="M283 324h45" stroke="#66e3b5"/>
        <path d="M523 324h187" stroke="#ab99f0" stroke-opacity=".1"/><path d="M523 324h47" stroke="#ab99f0"/>
        <path d="M763 324h187" stroke="#3bc8ef" stroke-opacity=".1"/><path d="M763 324h26" stroke="#3bc8ef"/>
      </g>
      <g fill="#7c8e9c" font-size="10"><text x="282" y="349">8 processadores lógicos</text><text x="522" y="349">usados de 32,0 GiB</text><text x="762" y="349">usados de 512,0 GiB</text><text x="1002" y="349">Desde a última inicialização</text></g>
      <text x="283" y="417" fill="#e8eef2" font-size="13" font-weight="600">Atividade do servidor</text>
      <circle cx="805" cy="413" r="3" fill="#66e3b5"/><text x="814" y="417" fill="#97a7b4" font-size="10">CPU</text>
      <circle cx="857" cy="413" r="3" fill="#ab99f0"/><text x="866" y="417" fill="#97a7b4" font-size="10">RAM</text>
      <g stroke="#ffffff" stroke-opacity=".05"><path d="M315 448h586M315 482h586M315 516h586M315 550h586"/></g>
      <g fill="#6f8494" font-size="9"><text x="279" y="451">100%</text><text x="285" y="485">75%</text><text x="285" y="519">50%</text><text x="285" y="553">25%</text></g>
      <path d="M315 558L344 551L373 556L402 535L431 542L460 508L489 521L518 527L547 539L576 505L605 489L634 515L663 537L692 526L721 548L750 539L779 543L808 522L837 542L866 535L900 550V574H315Z" fill="url(#area)"/>
      <path d="M315 558L344 551L373 556L402 535L431 542L460 508L489 521L518 527L547 539L576 505L605 489L634 515L663 537L692 526L721 548L750 539L779 543L808 522L837 542L866 535L900 550" fill="none" stroke="#66e3b5" stroke-width="2.3" stroke-linejoin="round"/>
      <path d="M315 552L373 553L431 552L489 548L547 550L605 549L663 551L721 550L779 549L837 550L900 550" fill="none" stroke="#ab99f0" stroke-width="2"/>
      <g fill="#6f8494" font-size="9"><text x="316" y="590">-5 min</text><text x="590" y="590">-2 min</text><text x="872" y="590">agora</text></g>
      <text x="958" y="417" fill="#e8eef2" font-size="13" font-weight="600">Serviços</text>
      <g font-size="12" fill="#dce5ea"><text x="960" y="461">SSH</text><text x="960" y="511">Docker</text><text x="960" y="561">Ollama</text></g>
      <g fill="#66e3b5" fill-opacity=".08"><rect x="1109" y="443" width="83" height="26" rx="13"/><rect x="1109" y="493" width="83" height="26" rx="13"/><rect x="1109" y="543" width="83" height="26" rx="13"/></g>
      <g fill="#66e3b5" font-size="11"><circle cx="1122" cy="456" r="2.5"/><text x="1132" y="460">Online</text><circle cx="1122" cy="506" r="2.5"/><text x="1132" y="510">Online</text><circle cx="1122" cy="556" r="2.5"/><text x="1132" y="560">Online</text></g>
      <text x="960" y="592" fill="#66e3b5" font-size="10">Ver serviços ↗</text>
      <use href="#chip" x="283" y="652" color="#66e3b5"/>
      <text x="319" y="661" fill="#e8eef2" font-size="12" font-weight="600">NVIDIA GPU</text>
      <text x="319" y="682" fill="#7c8e9c" font-size="10">GPU 42% · VRAM 5,2 / 12 GiB · 57°C · 82 W</text>
      <text x="959" y="659" fill="#ab99f0" font-size="12" font-weight="600">✧ Ollama</text>
      <text x="959" y="682" fill="#dce5ea" font-size="11">1 modelo carregado</text>
    </g>
    <text x="640" y="767" text-anchor="middle" fill="#93a9a6" font-size="11" letter-spacing="2">NATIVE macOS APP · SSH · MENU BAR DASHBOARD</text>
  </g>
</svg>
